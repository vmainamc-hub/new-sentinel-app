name: Sync site manager catalog

on:
  push:
    branches: [main, master]
    paths:
      - 'src/components/premium/site-customization.ts'
      - 'scripts/site-customization-catalog.js'
      - 'scripts/sync-site-customization-catalog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Generate current manager catalog
        run: node scripts/sync-site-customization-catalog.js

      - name: Commit catalog if premium navigation changed
        shell: bash
        run: |
          if git diff --quiet -- public/site-config/catalog.json; then
            echo 'Catalog already matches the live premium navigation.'
            exit 0
          fi
          git config user.name 'site-catalog-bot'
          git config user.email 'site-catalog-bot@users.noreply.github.com'
          git add public/site-config/catalog.json
          git commit -m 'chore: sync site manager navigation catalog'
          git push
